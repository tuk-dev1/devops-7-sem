# tasks file for prometheus
---
- name: Ensure prometheus user exists
  ansible.builtin.user:
    name: prometheus
    shell: /sbin/nologin

- name: Create Prometheus directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: prometheus
    group: prometheus
    mode: 0755
  loop:
    - /etc/prometheus
    - /var/lib/prometheus

- name: Download Prometheus tarball
  ansible.builtin.get_url:
    url: "https://github.com/prometheus/prometheus/releases/download/v2.46.0/prometheus-2.46.0.linux-amd64.tar.gz"
    dest: /tmp/prometheus.tar.gz
    mode: 0644

- name: Extract Prometheus binaries
  ansible.builtin.unarchive:
    src: /tmp/prometheus.tar.gz
    dest: /tmp/
    remote_src: true

- name: Install Prometheus binaries
  ansible.builtin.copy:
    src: "/tmp/prometheus-2.46.0.linux-amd64/{{ item }}"
    dest: "/usr/local/bin/{{ item }}"
    mode: 0755
    remote_src: true
  loop:
    - prometheus
    - promtool

- name: Copy default Prometheus configuration
  ansible.builtin.template:
    src: templates/prometheus.yml.j2
    dest: /etc/prometheus/prometheus.yml
    owner: prometheus
    group: prometheus
    mode: 0644

- name: Create Prometheus systemd service
  ansible.builtin.template:
    src: templates/prometheus.service.j2
    dest: /etc/systemd/system/prometheus.service
    mode: 0644

- name: Ensure /etc/alertmanager directory exists
  ansible.builtin.file:
    path: /etc/alertmanager
    state: directory
    mode: '0755'

- name: Configure Alertmanager
  copy:
    src: templates/alertmanager.yml.j2
    dest: /etc/alertmanager/alertmanager.yml

- name: Reload systemd
  ansible.builtin.command: systemctl daemon-reload

- name: Enable and start Prometheus service
  ansible.builtin.service:
    name: prometheus
    state: started
    enabled: true
