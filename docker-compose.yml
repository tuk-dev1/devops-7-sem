version: '3'

services:
  web:
    image: timurbabs/django
    ports:
      - "8000:8000"
    volumes:
      - ./app:/app
    command: python3 /app/manage.py runserver 0.0.0.0:8000

  db:
    image: postgres:latest
    environment:
      POSTGRES_DB: mydb
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
